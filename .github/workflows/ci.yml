name: CI

# Roda a cada push em main e em todo pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    name: Verificar (typecheck, lint, format, testes, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verificação de formatação
        run: npm run format:check

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
